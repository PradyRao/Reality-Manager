name: Build Reality Manager
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: pyinstaller --noconfirm --clean RealityManager.spec
      - uses: actions/upload-artifact@v4
        with:
          name: Reality-Manager-Windows
          path: dist/Reality Manager.exe

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: pyinstaller --noconfirm --clean RealityManager.spec
      - run: ditto -c -k --sequesterRsrc --keepParent "dist/Reality Manager.app" "dist/Reality Manager-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Reality-Manager-macOS
          path: dist/Reality Manager-macOS.zip
